name: Commit Check

# 커밋 메시지 형식 검증 (G-009).
# 형식: WI-NNN-[type] 한글 작업명
#   - NNN: 숫자(001) / 영숫자(A2a) / 서브넘버(001-1)
#   - type: feat / fix / docs / style / refactor / test / chore / perf / ci / revert
#   - 시스템 커밋: WI-chore / WI-docs (번호 없음 허용)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  commit-format:
    name: 커밋 메시지 형식 검증
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 커밋 메시지 형식 검증
        run: |
          # PR이면 PR 커밋만, push면 마지막 커밋 검증
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --no-merges --format="%H %s" origin/${{ github.base_ref }}..HEAD)
          else
            COMMITS=$(git log --no-merges --format="%H %s" -1)
          fi

          PATTERN='^WI-([0-9A-Za-z]+(-[0-9]+)?-(feat|fix|docs|style|refactor|test|chore|perf|ci|revert)|chore|docs)\s+.+$'

          FAILED=0
          while IFS= read -r line; do
            HASH=$(echo "$line" | awk '{print $1}')
            MSG=$(echo "$line" | cut -d' ' -f2-)

            if echo "$MSG" | grep -qE "$PATTERN"; then
              echo "✓ $HASH: $MSG"
            else
              echo "✗ $HASH: $MSG"
              echo "  형식 위반. 예: WI-001-feat 사용자 인증 추가"
              FAILED=1
            fi
          done <<< "$COMMITS"

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "::error::커밋 메시지 형식 위반. .github/PULL_REQUEST_TEMPLATE.md 참고."
            exit 1
          fi
